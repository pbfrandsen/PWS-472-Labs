# GitHub Pages configuration for PWS 472 Labs
# (Pages source: repo Settings > Pages > Source > master, /docs folder)
#
# Each lab is a Markdown file (lab-N.md) rendered through _layouts/lab.html.
# Edit the Markdown and push; GitHub builds the site. No theme, no plugins.

markdown: kramdown
kramdown:
  input: GFM
  # Keep quotes straight so commands copied from prose still work.
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter_opts:
    disable: true

exclude:
  - "*.py"
